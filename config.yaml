# intervals: [1m, 2m, 5m, 15m, 30m] #1m, 2m, 5m, 15m, 30m, 60m, 90m, 1h, 4h, 1d, 5d, 1wk, 1mo, 3mo
tz: Asia/Kolkata
discord_llm_msg: "🤖 converting query. Please wait..."
interval_translation:
  # "1m": "minute"
  # "2m": "minute2"
  "5m": "minute5"
  "15m": "minute15"
  "30m": "minute30"
  "60m": "hour"
  "1h": "hour"
  "1d": "day"
  "1wk": "week"
  "1mo": "month"
interval_seconds:
  # "minute": 60
  # "minute2": 120
  "minute5": 300
  "minute15": 900
  "minute30": 1800
  "hour": 3600
  "day": 86400
  "week": 604800
  "month": 2592000
cron_schedules:
  # "1m": { "minute": "*/1", "second": "0", "day_of_week": "mon-fri" } # runs at 0 seconds of every minute
  # "2m": { "minute": "*/2", "hour": 9-16, "second": "5", "day_of_week": "mon-fri" } # runs at 5 seconds of every 2nd minute
  "5m": {
      "minute": "*/5",
      "hour": 9-16,
      "second": "10",
      "day_of_week": "mon-fri",
    } # runs at 10 seconds of every 5th minute
  "15m": {
      "minute": "*/15",
      "hour": 9-16,
      "second": "15",
      "day_of_week": "mon-fri",
    } # runs at 15 seconds of every 15th minute
  "30m": {
      "minute": "*/30",
      "hour": 9-16,
      "second": "20",
      "day_of_week": "mon-fri",
    } # runs at 20 seconds of every 30th minute
  "1h": {
      "minute": "0",
      "hour": "9-16",
      "second": "25",
      "day_of_week": "mon-fri",
    } # runs at 25 seconds of the 0th minute each hour
  "1d": {
      "minute": "0",
      "hour": "9-16",
      "second": "30",
      "day_of_week": "mon-fri",
    } # runs at 16:06:30
  "1wk": {
      "minute": "0",
      "hour": "9-16",
      "second": "35",
      "day_of_week": "mon-fri",
    } # runs on Friday at 16:07
cron_notification: { "minute": "*/4", "second": "5", "day_of_week": "mon-fri" } # runs every 4th minute
cron_news_alerts: { "minute": "*/17", "second": "5", "day_of_week": "mon-fri" } # runs every 17th minute, just some timer to distribute load
backtest_iterations: 10
app_data_path: "/home/palash/app/appdata"
pytick_test_path: "/home/palash/app/pytick/test"
