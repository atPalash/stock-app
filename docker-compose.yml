# =====================================================
# eval "$(ssh-agent -s)" && ssh-add ~/.ssh/id_ed25519_asus
# export USERNAME=$(id -un) USERID=$(id -u) GROUPID=$(id -g) && podman-compose build
# export USERNAME=$(id -un) USERID=$(id -u) GROUPID=$(id -g) && podman-compose up -d
# =====================================================

# =====================================================
# Common Build Arguments
# =====================================================
x-build-args: &build-args
  USERNAME: ${USERNAME:?USERNAME must be set}
  USERID: ${USERID:?USERID must be set}
  GROUPID: ${GROUPID:?GROUPID must be set}

# =====================================================
# Common Environment
# =====================================================
x-common-env: &common-env
  USERNAME: ${USERNAME:?USERNAME must be set}
  USERID: ${USERID:?USERID must be set}
  GROUPID: ${GROUPID:?GROUPID must be set}
  SSH_AUTH_SOCK: /home/${USERNAME:?USERNAME must be set}/.ssh-agent/agent.sock
  VENV_PATH: /home/${USERNAME:?USERNAME must be set}/.venv

# =====================================================
# Common Application Configuration
# =====================================================
x-common-config: &common-config
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

  user: ${USERNAME}
  restart: unless-stopped
  tty: true
  stdin_open: true

  network_mode: host
  userns_mode: keep-id

  depends_on:
    redis:
      condition: service_healthy

  volumes:
    - ${SSH_AUTH_SOCK:?SSH_AUTH_SOCK must be set}:/home/${USERNAME}/.ssh-agent/agent.sock
    - ./:/home/${USERNAME}/stock-app

  healthcheck:
    test:
      - CMD-SHELL
      - "curl -fsS http://localhost:$${APP_PORT}/health > /dev/null 2>&1 || exit 1"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 5s

# =====================================================
# Services
# =====================================================
services:
  # ---------------------------------------------------
  # Redis
  # ---------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    network_mode: host

    volumes:
      - ./redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------
  # India Application
  # ---------------------------------------------------
  stockappind:
    <<: *common-config

    container_name: stockappind
    image: stockappind:latest

    build:
      context: .
      dockerfile: Dockerfile
      target: ind
      args:
        <<: *build-args

    environment:
      <<: *common-env
      TZ: Asia/Kolkata
      APP_PORT: "8000"

  # ---------------------------------------------------
  # US Application
  # ---------------------------------------------------
  stockappus:
    <<: *common-config

    container_name: stockappus
    image: stockappus:latest

    build:
      context: .
      dockerfile: Dockerfile
      target: us
      args:
        <<: *build-args

    environment:
      <<: *common-env
      TZ: America/New_York
      APP_PORT: "8001"

  # ---------------------------------------------------
  # DEV Application
  # ---------------------------------------------------
  stockappdev:
    <<: *common-config

    container_name: stockappdev
    image: stockappdev:latest

    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        <<: *build-args

    environment:
      <<: *common-env
      TZ: America/New_York
      APP_PORT: "7999"
