  "query": "Feature: pytick llm  \nScenario: Hammer and inverted hammer formation\
    \ analysis with stricter conditions using previous day data  \nGiven stocks from\
    \ index nifty50  \nWhen let open = oldest in 2 samples of day open  \n* let close\
    \ = oldest in 2 samples of day close  \n* let high = oldest in 2 samples of day\
    \ high  \n* let low = oldest in 2 samples of day low  \nThen let hammer = (((high\
